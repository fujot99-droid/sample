name: Auto merge
on: pull_request
jobs:
  merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}s
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: gh pr merge "${GITHUB_HEAD_REF}" --rebase --auto
