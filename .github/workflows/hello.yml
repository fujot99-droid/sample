name: Hello
on:
  push:
  workflow_dispatch:
    inputs:
      greeting:
        type: string
        default: 'hello'
        required: true
        description: A cheerful word
jobs:
  hello_:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git log -1
          tree -a .
  dump:
    runs-on: ubuntu-latest
    # ジョブレベルの env で使えるコンテキストのみ
    env:
      A: ${{ toJSON(github) }}
      C: ${{ toJSON(vars) }}
      H: ${{ toJSON(secrets) }}
      I: ${{ toJSON(strategy) }}
      J: ${{ toJSON(matrix) }}
      K: ${{ toJSON(needs) }}
      L: ${{ toJSON(inputs) }}
    steps:
      - run: echo "${A}"
      # env / job / steps / runner はステップレベルでのみ参照可能
      - run: echo "${B}"
        env:
          B: ${{ toJSON(env) }}
      - run: echo "${C}"
      - run: echo "${D}"
        env:
          D: ${{ toJSON(job) }}
      - run: echo "${F}"
        env:
          F: ${{ toJSON(steps) }}
      - run: echo "${G}"
        env:
          G: ${{ toJSON(runner) }}
      - run: echo "${H}"
      - run: echo "${I}"
      - run: echo "${J}"
      - run: echo "${K}"
      - run: echo "${L}"