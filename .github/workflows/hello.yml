name: Hello
run-name: Run by @${{github.actor}}
on:
  push:
  workflow_dispatch:
    inputs:
      greeting:
        type: string
        default: 'hello'
        required: true
        description: A cheerful word
permissions:
  contents: read
jobs:
  hello_:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "test=Hello" >> "${GITHUB_OUTPUT}"
      - run: |
          git log -1
          tree -a .
      - env:
          RESULT: ${{steps.source.outputs.test}}
        run: echo "${RESULT}"
  dump:
    if: ${{vars.ENV == true}}
    runs-on: ubuntu-latest
    # ジョブレベルの env で使えるコンテキストのみ
    env:
      A: ${{ toJSON(github) }}
      C: ${{ toJSON(vars) }}
      H: ${{ toJSON(secrets) }}
      I: ${{ toJSON(strategy) }}
      J: ${{ toJSON(matrix) }}
      K: ${{ toJSON(needs) }}
      L: ${{ toJSON(inputs) }}ﬁ
    steps:
      - run: echo "${A}"
      # env / job / steps / runner はステップレベルでのみ参照可能
      - run: echo "${B}"
        env:
          B: ${{ toJSON(env) }}
      - run: echo "${C}"
      - run: echo "${D}"
        env:
          D: ${{ toJSON(job) }}
      - run: echo "${F}"
        env:
          F: ${{ toJSON(steps) }}
      - run: echo "${G}"
        env:
          G: ${{ toJSON(runner) }}
      - run: echo "${H}"
        if: ${{failure()}}
      - run: echo "${H}"
        if: ${{cancelled()}}
      - run: echo "${I}"
      - run: echo "${J}"
        if: ${{always()}}
      - run: echo "${K}"
        if: ${{success()}}
      - run: echo "${L}"
        if: ${{contains(github.run_id, '1')}}
