name: Hello
on:
  push:
  workflow_dispatch:
    inputs:
      greeting:
        type: string
        default: 'hello'
        required: true
        description: A cheerful word
jobs:
  hello_:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git log -1
          tree -a .